# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: gossm
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.gossmVersion=v{{.Version}}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

# Release notes are grouped by Conventional Commit type.
dockers_v2:
  - images:
      - ghcr.io/ottramst/gossm
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Interactive CLI for AWS SSM Session Manager
      org.opencontainers.image.url: https://github.com/ottramst/gossm
      org.opencontainers.image.source: https://github.com/ottramst/gossm
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^chore: '
      - '^Merge '
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 100
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 200
    - title: Dependencies
      regexp: '^chore\(deps\)!?:'
      order: 300
    - title: Other
      order: 999

release:
  github:
    owner: ottramst
    name: gossm
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
