# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

# Pin SCM detection to GitHub: without this, GoReleaser infers the release
# host from whichever token env var it finds (a stray GITLAB_TOKEN in a
# local shell produces gitlab.com download URLs in the Homebrew cask).
force_token: github

before:
  hooks:
    - go mod tidy

builds:
  - binary: gossm
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.gossmVersion=v{{.Version}}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

# Release notes are grouped by Conventional Commit type.
# Pushes the cask to ottramst/homebrew-tap. Skipped gracefully when the
# HOMEBREW_TAP_TOKEN secret is not configured; "auto" skips prereleases.
homebrew_casks:
  - name: gossm
    repository:
      owner: ottramst
      name: homebrew-tap
      # .Env requires the variable to be DEFINED (the release workflow always
      # defines it, empty when the secret is missing); envOrDefault is not
      # available in the GoReleaser version the action resolves.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/ottramst/gossm
    description: Interactive CLI for AWS SSM Session Manager
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}auto{{ else }}true{{ end }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    # The release binaries are unsigned; clear the quarantine flag so
    # Gatekeeper doesn't block the first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gossm"]
          end

dockers_v2:
  - images:
      - ghcr.io/ottramst/gossm
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Interactive CLI for AWS SSM Session Manager
      org.opencontainers.image.url: https://github.com/ottramst/gossm
      org.opencontainers.image.source: https://github.com/ottramst/gossm
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^chore: '
      - '^Merge '
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 100
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 200
    - title: Dependencies
      regexp: '^chore\(deps\)!?:'
      order: 300
    - title: Other
      order: 999

release:
  github:
    owner: ottramst
    name: gossm
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
