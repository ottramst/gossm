name: Update Plugin

# Keeps the embedded session-manager-plugin binaries current: compares the
# tracked version against AWS's latest and opens a PR when they differ.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update embedded plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for a new plugin version
        id: check
        run: |
          latest=$(curl -sf https://s3.amazonaws.com/session-manager-downloads/plugin/latest/VERSION | tr -d '[:space:]')
          echo "$latest" | grep -Eq '^[0-9]+(\.[0-9]+){3}$' || { echo "::error::unexpected version format: $latest"; exit 1; }
          current=$(tr -d '[:space:]' < internal/assets/plugin/VERSION)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "current=$current latest=$latest"

      - name: Install extraction tools
        if: steps.check.outputs.latest != steps.check.outputs.current
        run: sudo apt-get update -q && sudo apt-get install -yq libarchive-tools cpio

      - name: Download and extract plugins
        if: steps.check.outputs.latest != steps.check.outputs.current
        run: ./scripts/update-plugins.sh "${{ steps.check.outputs.latest }}"

      - name: Open pull request
        if: steps.check.outputs.latest != steps.check.outputs.current
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-embedded-plugin
          delete-branch: true
          commit-message: "chore(deps): bump embedded session-manager-plugin to ${{ steps.check.outputs.latest }}"
          title: "chore(deps): bump embedded session-manager-plugin to ${{ steps.check.outputs.latest }}"
          labels: enhancement
          body: |
            Automated update of the embedded session-manager-plugin binaries
            from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}.

            Note: CI does not start automatically on PRs opened by the
            workflow token — close and reopen this PR (or push an empty
            commit) to trigger the required checks.
